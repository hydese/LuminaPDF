[package]
name = "luminapdf"
version = "1.0.5"
description = "Minimalist Cross-Platform PDF Reader with Intelligent Dark Mode"
authors = ["hydese"]
repository = "https://github.com/hydese/LuminaPDF"
license = "MIT"
edition = "2021"

[lib]
name = "luminapdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.10"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
log = "0.4"

[dev-dependencies]
tempfile = "3.14"
